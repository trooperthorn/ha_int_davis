alias: "Weather Emergency: 15-Minute Flash Flood Warning"
description: "Detects rapid short-term precipitation exceeding drainage thresholds."
mode: single
trigger:
  - platform: numeric_state
    entity_id: sensor.davis_vantage_rain_15_min
    above: 0.75  # 0.75 inches in 15 minutes (~3.0 in/hr rate)
action:
  - action: notify.notify
    data:
      title: "🌊 Flash Flood Warning"
      message: >
        Extreme rainfall: {{ states('sensor.davis_vantage_rain_15_min') }} in. 
        in the last 15 minutes (Storm total: {{ states('sensor.davis_vantage_rain_storm') }} in.).
      data:
        priority: high
