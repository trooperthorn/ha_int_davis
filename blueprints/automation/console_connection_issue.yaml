alias: "Weather Station: ISS Connection Lost"
description: >
  Warns if the outdoor sensor suite (ISS) stops reporting valid telemetry -
  e.g. transmitter battery/solar failure, radio interference, or the unit
  going out of range. Note: if this integration was set up before entity
  translations were fixed, this binary sensor's entity_id may still be the
  older generic "binary_sensor.davis_vantage_connectivity" - check Settings
  > Devices & Services > Entities if the entity_id below isn't found.
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.davis_vantage_outdoor_sensor_suite_status
    to: "off"
    for:
      minutes: 10
action:
  - action: notify.notify
    data:
      title: "📡 Davis ISS Connection Lost"
      message: >
        The outdoor sensor suite has stopped reporting valid data for 10+
        minutes. Check the transmitter battery/solar panel, antenna, and
        that the unit is still within range.
